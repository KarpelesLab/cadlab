name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  oracles:
    name: Oracle tests (KiCad 10, gerbv, ngspice)
    runs-on: ubuntu-24.04
    # Informative for now: KiCad comes from a Launchpad PPA (not pinned to a patch release, and a
    # few minutes to install). Make it blocking once it has proven stable (docs/TESTING.md).
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: oracles
      - name: Install KiCad 10, gerbv and ngspice
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          # No recommends: the symbol/footprint/3D libraries are not needed (and are large).
          sudo apt-get install --yes --no-install-recommends kicad gerbv ngspice xvfb xauth
          kicad-cli version
          gerbv --version
          ngspice --version
      - name: Oracle tests
        env:
          CADLAB_ORACLES: "1"
        # xvfb: gerbv (GTK) may want a display even when exporting.
        run: >-
          xvfb-run -a cargo test --all-features
          --test oracle --test kicad_oracle --test kicad_pcb_oracle --test gerber_oracle
          --test drc_crosscheck --test gerber_crosscheck --test electrical --test kicad_pcb_import --test kicad_lib_import -- --nocapture
      - name: Keep reports and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-outputs
          path: target/tmp/
          if-no-files-found: ignore

  openems:
    name: openEMS oracle (full-wave export against sim.sparams)
    runs-on: ubuntu-24.04
    # Informative, like the other oracle jobs: openEMS is built from source (no Ubuntu package or
    # Linux wheel), pinned to an openEMS-Project commit and cached (docs/TESTING.md).
    continue-on-error: true
    timeout-minutes: 60
    env:
      OPENEMS_PROJECT_REV: 1c6e5c11017a24a0a821aaaa18f7628ebc7540e2
      OPENEMS_PREFIX: ${{ github.workspace }}/../openEMS
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: openems
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake git libhdf5-dev \
            libboost-all-dev libtinyxml-dev zlib1g-dev libcgal-dev python3-pip python3-venv \
            python3-setuptools python3-setuptools-scm python3-numpy python3-matplotlib python3-h5py cython3
      - name: Cache openEMS
        id: cache-openems
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENEMS_PREFIX }}
          key: openems-${{ env.OPENEMS_PROJECT_REV }}-ubuntu-24.04
      - name: Build openEMS (headless, Python modules)
        if: steps.cache-openems.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/thliebig/openEMS-Project.git "$RUNNER_TEMP/openEMS-Project"
          cd "$RUNNER_TEMP/openEMS-Project"
          git checkout "$OPENEMS_PROJECT_REV"
          git submodule update --init --recursive
          ./update_openEMS.sh "$OPENEMS_PREFIX" --python --disable-GUI
      - name: openEMS oracle tests
        env:
          CADLAB_ORACLES: "1"
        run: |
          export CADLAB_ORACLE_OPENEMS="$OPENEMS_PREFIX/bin/openEMS"
          export CADLAB_ORACLE_PYTHON="$OPENEMS_PREFIX/venv/bin/python3"
          export LD_LIBRARY_PATH="$OPENEMS_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$CADLAB_ORACLE_PYTHON" -c "import CSXCAD, openEMS, numpy; print('openEMS Python modules ok')"
          cargo test --release --all-features --test openems -- --nocapture
      - name: Summary
        if: always()
        run: |
          if [ -f target/tmp/openems_oracle/summary.md ]; then
            { echo '### openEMS against sim.sparams (lossy microstrip)'; cat target/tmp/openems_oracle/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openems-oracle
          path: |
            target/tmp/openems_oracle/*.md
            target/tmp/openems_oracle/*.s2p
            target/tmp/openems_oracle/*.xml
            target/tmp/openems_oracle/*.py
          if-no-files-found: ignore

  corpus:
    name: Open-source corpus (KiCad 10, gerbv)
    runs-on: ubuntu-24.04
    # Informative for now, like the oracle job (docs/TESTING.md, "Open-source corpus").
    continue-on-error: true
    timeout-minutes: 60
    env:
      CADLAB_CORPUS_DIR: ${{ github.workspace }}/../cadlab-corpus
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: corpus
      - name: Install KiCad 10 and gerbv
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          # No recommends: the symbol/footprint/3D libraries are not needed (and are large).
          sudo apt-get install --yes --no-install-recommends kicad gerbv xvfb xauth
          kicad-cli version
          gerbv --version
      # The projects are fetched at their pinned commits (never vendored); the cache key is the
      # manifest, so changing a pin refetches.
      - name: Cache the corpus
        uses: actions/cache@v4
        with:
          path: ${{ env.CADLAB_CORPUS_DIR }}
          key: corpus-${{ hashFiles('tests/corpus/projects.toml', 'scripts/fetch-corpus.sh') }}
      - name: Fetch the corpus
        run: scripts/fetch-corpus.sh "$CADLAB_CORPUS_DIR"
      - name: Corpus tests
        env:
          CADLAB_ORACLES: "1"
          CADLAB_CORPUS_ROUTE: "1"
          CADLAB_CORPUS_ROUTE_BUDGET: "30"
        # xvfb: gerbv (GTK) may want a display even when exporting.
        run: xvfb-run -a cargo test --release --all-features --test corpus -- --nocapture
      - name: Summary
        if: always()
        run: |
          if [ -f target/tmp/corpus/summary.txt ]; then
            { echo '```'; cat target/tmp/corpus/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: |
            target/tmp/corpus/report.json
            target/tmp/corpus/summary.txt
            target/tmp/corpus/*/drc-*.json
            target/tmp/corpus/*/reexport/drc.json
          if-no-files-found: ignore

  bench:
    name: Benchmarks (router regression, large-board timings)
    runs-on: ubuntu-24.04
    # Blocking (DECISIONS D43): the router results are deterministic and compared with
    # tests/golden/bench/route.json (completion, DRC, vias, length); timings fail only on large
    # regressions relative to the run's own median (tests/common/bench.rs), so a slower runner
    # does not fail it. One rayon thread keeps the timings comparable between machines.
    timeout-minutes: 45
    env:
      RAYON_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - name: Router regression and timings
        run: >-
          cargo test --release --all-features --test route_bench --test perf --
          --ignored --nocapture --test-threads 1 route_benchmark_regression big_board_timings
      - name: Summary
        if: always()
        run: |
          for f in target/tmp/bench/route.md target/tmp/bench/perf.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: target/tmp/bench/
          if-no-files-found: ignore

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  licenses:
    name: Licenses & advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
