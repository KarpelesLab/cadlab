name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  oracles:
    name: Oracle tests (KiCad 10, gerbv)
    runs-on: ubuntu-24.04
    # Informative for now: KiCad comes from a Launchpad PPA (not pinned to a patch release, and a
    # few minutes to install). Make it blocking once it has proven stable (docs/TESTING.md).
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: oracles
      - name: Install KiCad 10 and gerbv
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          # No recommends: the symbol/footprint/3D libraries are not needed (and are large).
          sudo apt-get install --yes --no-install-recommends kicad gerbv xvfb xauth
          kicad-cli version
          gerbv --version
      - name: Oracle tests
        env:
          CADLAB_ORACLES: "1"
        # xvfb: gerbv (GTK) may want a display even when exporting.
        run: >-
          xvfb-run -a cargo test --all-features
          --test oracle --test kicad_oracle --test kicad_pcb_oracle --test gerber_oracle
          --test drc_crosscheck --test gerber_crosscheck --test kicad_pcb_import -- --nocapture
      - name: Keep reports and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-outputs
          path: target/tmp/
          if-no-files-found: ignore

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  licenses:
    name: Licenses & advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
