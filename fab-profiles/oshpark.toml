thickness = "https://docs.oshpark.com/services/four-layer/"
outer_copper = "https://docs.oshpark.com/services/four-layer/"
inner_copper = "https://docs.oshpark.com/services/four-layer/"
min_track = "https://docs.oshpark.com/services/four-layer/"
