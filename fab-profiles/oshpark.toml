[output]
include = ["copper", "mask", "silk", "profile", "drill"]  # no stencil service; paste is not used
archive = "{project}-oshpark.zip"
drill_format = "excellon"
# No `names`: OSH Park detects KiCad's output names and Gerber X2 automatically; the suggested
# Protel-style pattern is only for tools it cannot detect. Its drill page asks tools it has no guide
# for to write Excellon in inches 2:4; cadlab's metric Excellon (as KiCad writes it) is not covered
# by that page.
unverified = ["drill_format"]
[output.cite]
names = "https://docs.oshpark.com/design-tools/kicad/"
drill_format = "https://docs.oshpark.com/submitting-orders/drill-specs/"
