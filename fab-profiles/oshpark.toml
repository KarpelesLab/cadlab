min_track = "0.127mm"         # 5 mil
min_space = "0.127mm"         # 5 mil
min_drill = "0.254mm"         # 10 mil
min_via_ring = "0.1016mm"     # 4 mil
min_pth_ring = "0.1016mm"
hole_to_hole = "0.127mm"
copper_to_edge = "0.381mm"
min_silk_width = "0.127mm"
mask_dam = "0.1016mm"
via_in_pad = false
