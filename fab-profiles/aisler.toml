[output]
include = ["copper", "mask", "paste", "silk", "profile", "drill"]
archive = "{project}-aisler.zip"
drill_format = "excellon"
# AISLER asks for drill files in inches with 2:4 precision; cadlab writes metric Excellon (XNC).
# AISLER recommends ODB++ or native CAD files over Gerber.
unverified = ["drill_format"]
[output.cite]
names = "https://community.aisler.net/t/support-for-traditional-gerber-files/99"
archive = "https://community.aisler.net/t/support-for-traditional-gerber-files/99"
drill_format = "https://community.aisler.net/t/support-for-traditional-gerber-files/99"
# AISLER's naming table for traditional Gerber files; internal planes are numbered from 1.
[output.names]
copper_top = "{project}.toplayer.ger"
copper_inner = "{project}.internalplane{n}.ger"
copper_bottom = "{project}.bottomlayer.ger"
mask_top = "{project}.topsoldermask.ger"
mask_bottom = "{project}.bottomsoldermask.ger"
paste_top = "{project}.toppaste.ger"
paste_bottom = "{project}.bottompaste.ger"
silk_top = "{project}.topsilkscreen.ger"
silk_bottom = "{project}.bottomsilkscreen.ger"
profile = "{project}.boardoutline.ger"
drill_pth = "{project}.drills_pth.xln"
drill_npth = "{project}.holes_npth.xln"
