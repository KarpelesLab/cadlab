# cargo-deny configuration: cadlab is MIT, so every dependency must be under a permissive,
# MIT-compatible license. No GPL/LGPL/AGPL (DECISIONS D7).

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The allow list covers licenses common in the Rust ecosystem, not only those used today.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
