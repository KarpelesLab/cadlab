# ---------------------------------------------------------------------------------------------
# Presets
# ---------------------------------------------------------------------------------------------

# Class 2: cadlab's default rules, unchanged. Its 0.13 mm ring is cadlab's own choice: IPC-6012
# class 2 accepts breakout, while the IPC-2221 level C design land asks for 0.05 + 0.2 / 2 = 0.15 mm.
[preset.ipc2]
ipc_class = 2

# Class 3: annular ring = class 3 external minimum + half the level A allowance (preferred
# producibility; not raised for more than 8 layers or copper above 1 oz), default via sized for it.
[preset.ipc3]
ipc_class = 3
min_annular_ring = "0.25mm"
via_diameter = "0.8mm"
[preset.ipc3.derived]
min_annular_ring = ["ipc6012.class3.external_ring", "ipc2221.allowance.level_a"]
via_diameter = ["ipc6012.class3.external_ring", "ipc2221.allowance.level_a"]
