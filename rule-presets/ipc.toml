# IPC-derived design rule presets (`board.rules --preset ipc2|ipc3`, docs/BOARD.md "Rule presets").
#
# The IPC standards are paywalled and were not read. A `[[reference]]` value is `status = "confirmed"`
# when at least two independent sources that attribute it to the standard were read on `verified_at`
# and agree; `sources` lists them, `dissent` lists pages read that say otherwise. Anything else is
# `status = "unverified"`. A preset names under `derived` the references each of its values is built
# from: applying a preset with a value that rests on an unverified reference warns
# `board.rules_unverified`.
#
# A preset holds only the rule fields that differ from cadlab's default rules (`Rules::default`,
# which are cadlab's own conservative choices, not IPC numbers).

verified_at = "2026-11-13"

# ---------------------------------------------------------------------------------------------
# Reference values
# ---------------------------------------------------------------------------------------------

[[reference]]
id = "ipc6012.class3.external_ring"
standard = "IPC-6012 (rev. D/E/F), 3.4.2 and Table 3-9 \"Minimum Annular Ring\""
what = "Minimum external annular ring of a plated hole on the finished board, class 3; no breakout"
value = "0.05mm"
status = "confirmed"
sources = [
    "https://summitinterconnect.com/blog/article/pcb-design-annular-ring/",          # fabricator; rev. E Table 3-9: 0.001969 in
    "https://iconnect007.com/article/133540/fresh-pcb-concepts-how-large-does-that-pad-really-need-to-be/133543/pcb",  # NCAB: 0.002 in external for class 3
    "https://sllpcb.com/annular-ring-pcb/",                                           # rev. F: 50 um
    "https://resources.altium.com/p/meeting-standards-ipc-6012-class-3-annular-ring", # 2 mil
    "https://www.electronics.org/TOC/IPC-6012D.pdf",                                  # IPC's table of contents: section and table titles only
]
dissent = [
    "https://www.ultralibrarian.com/ipc-2221-pcb-design-standards",  # internal ring 0.025 mm for class 2, 0.05 mm for class 3; no table cited
    "https://wellerpcb.com/high-quality-printed-circuit-boards-manufacturing-ipc-class-2-and-3",  # 50/25 um and 90 deg breakout given for class 2 and 3 alike
]

