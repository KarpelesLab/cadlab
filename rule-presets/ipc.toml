# Land size, minimum = a + 2b + c (IPC-2221A/B 9.1.1): a = finished hole (drilled hole on internal
# layers), b = minimum annular ring, c = the allowance below. Add 0.05 mm to c for boards of more
# than 8 layers and per oz/ft2 of copper above 1 oz. IPC-2221C's table of contents no longer lists
# this table (its Table 9-1 is "Annular Rings (Minimum)").
[[reference]]
id = "ipc2221.allowance.level_a"
standard = "IPC-2221A/B, 9.1.1 and Table 9-1 \"Minimum Standard Fabrication Allowance for Interconnection Lands\""
what = "Fabrication allowance c, producibility level A (general, preferred)"
value = "0.4mm"
status = "confirmed"
sources = [
    "https://wellerpcb.com/high-quality-printed-circuit-boards-manufacturing-ipc-class-2-and-3",  # the table: 0.40 / 0.25 / 0.20 mm and both footnotes
    "https://resources.altium.com/p/pcb-size-and-pad-size-guidelines",                             # 16 / 10 / 8 mil
    "https://www.electronics.org/TOC/IPC-2221B.pdf",                                              # table title only
]
dissent = ["https://www.edn.com/standards-for-pth-hole-and-pad-diameter-sizes/"]  # 0.6 / 0.5 / 0.4 mm, no table or revision cited

[[reference]]
id = "ipc2221.allowance.level_b"
standard = "IPC-2221A/B, Table 9-1"
what = "Fabrication allowance c, producibility level B (moderate, standard)"
value = "0.25mm"
status = "confirmed"
sources = [
    "https://wellerpcb.com/high-quality-printed-circuit-boards-manufacturing-ipc-class-2-and-3",
    "https://iconnect007.com/article/133540/fresh-pcb-concepts-how-large-does-that-pad-really-need-to-be/133543/pcb",  # NCAB: level B 0.00984 in, +0.00197 in footnotes
    "https://resources.altium.com/p/pcb-size-and-pad-size-guidelines",
]
dissent = ["https://www.edn.com/standards-for-pth-hole-and-pad-diameter-sizes/"]

[[reference]]
id = "ipc2221.allowance.level_c"
standard = "IPC-2221A/B, Table 9-1"
what = "Fabrication allowance c, producibility level C (high, reduced producibility)"
value = "0.2mm"
status = "confirmed"
sources = [
    "https://wellerpcb.com/high-quality-printed-circuit-boards-manufacturing-ipc-class-2-and-3",
    "https://pcdandf.com/pcdesign/images/stories/mag/0709/0709white_table1.pdf",   # PCD&F 9/2007, IPC-2221A 9.1.1: level C 0.0079 in
