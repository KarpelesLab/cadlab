# Open-source KiCad projects used as import and oracle inputs (docs/TESTING.md, "Open-source corpus";
# DECISIONS D35). Nothing here is vendored: `scripts/fetch-corpus.sh` fetches each project at the pinned
# commit into a cache directory outside the repository (default `target/corpus`), and `tests/corpus.rs`
# reads it through `CADLAB_CORPUS_DIR`.
#
# Per project:
#   name     directory name under the corpus dir, and the name in reports
#   repo     git URL (GitHub)
#   sha      full 40-hex commit; the fetch checks out exactly this commit and verifies it
#   sparse   gitignore-style patterns of the files to check out (non-cone sparse checkout)
#   pcb      board file, relative to the repository root
#   sch      root schematic (optional): `kicad-cli sch export netlist` → `circuit.import`
#   license  SPDX identifier of the hardware design license (see the repository for the text)
#   layers   copper layers;  kicad: the KiCad major version that saved the board
#   notes    what the project covers
#   [[project.known]]         a DRC difference expected on this board: side = "kicad" | "cadlab",
#                             rule = KiCad type or cadlab code, max = how many unmatched findings of
#                             that rule are accepted, reason, and optionally stage = "original" |
#                             "reexport" (default: both comparisons). Counts are exact as of the pin
#                             and KiCad 10.0: a new difference, or more of a known one, fails.
#   [[project.gerber_known]]  a Gerber layer (or `drill`) whose differences are reported, not failed,
#                             with the reason.
# Global, principled allowances live in tests/common/drc_compare.rs and tests/corpus.rs; the entries
# here are board-specific and summarized in docs/TESTING.md ("Open-source corpus").
#
# The fetch script reads this file line by line: keep `key = "value"` lines and one-line arrays.
# Changing a pin or adding a project changes this file's hash, which is the CI cache key.

[[project]]
name = "nrfmicro"
repo = "https://github.com/joric/nrfmicro"
sha = "5ac390d9d133e781a46a9c9fe43880f4826422e0"
sparse = ["/hardware/", "/LICENSE*"]
pcb = "hardware/nrfmicro.kicad_pcb"
sch = "hardware/nrfmicro.kicad_sch"
license = "Unlicense"
layers = 2
kicad = 6
notes = "Pro Micro-sized nRF52840 module carrier: small 2-layer SMD board, castellated edge pads, solder-jumper custom pads"

[[project.known]]
side = "cadlab"
rule = "drc.clearance"
max = 3
stage = "original"
reason = "the JP1 solder-jumper pads carry a local clearance of 0.14 mm (import.local_setting); cadlab applies the 0.2 mm net clearance"

[[project.known]]
side = "kicad"
rule = "copper_edge_clearance"
max = 2
stage = "reexport"
reason = "KiCad also keeps copper away from the drawing the project puts on the Margin layer (past the USB-C shield pads J1.S1); cadlab's board edge is Edge.Cuts only"

[[project.known]]
side = "cadlab"
rule = "drc.courtyard_overlap"
max = 1
stage = "reexport"
reason = "R8 and U3 have no courtyard in KiCad; the ones the import generates overlap by 6.6 um, which KiCad's courtyard test lets pass on the re-export"

[[project.gerber_known]]
layer = "F.Mask"
reason = "the board sets a 0.25 mm solder mask minimum web: KiCad merges openings closer than that (J1's USB-C pads); cadlab draws one opening per pad"

[[project.gerber_known]]
layer = "B.Mask"
reason = "the board sets a 0.25 mm solder mask minimum web: KiCad merges openings closer than that; cadlab draws one opening per pad"

[[project.gerber_known]]
layer = "F.Paste"
reason = "through-hole pads (J1's shield slots, the module header) carry paste in KiCad (import.tht_paste); cadlab puts paste on SMD pads only"

