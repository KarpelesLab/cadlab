[package]
name = "cadlab"
version = "0.0.4"
edition = "2024"
rust-version = "1.95"
description = "Headless electronics CAD for programs and AI agents: parts, circuits, boards, routing, fab outputs."
license = "MIT"
repository = "https://github.com/KarpelesLab/cadlab"
keywords = ["eda", "pcb", "cad", "electronics", "mcp"]
categories = ["science", "command-line-utilities"]

[features]
default = ["cli", "net", "png", "parallel", "models3d", "ems"]
# The `cadlab` binary (CLI + MCP server). Library users can disable it to avoid the CLI dependencies.
cli = ["dep:clap", "dep:rpassword"]
# Network part research providers (DigiKey, ...).
net = ["dep:ureq"]
# PNG rendering (SVG needs no extra dependency).
png = ["dep:tiny-skia"]
# Multi-threaded polygon booleans (polyclip's rayon feature) and autorouting of independent nets;
# results are identical for any thread count. Zone fills of large boards are about a quarter faster.
parallel = ["polyclip/rayon", "dep:rayon"]
# 3D model import (footprint models in render.board3d, export.step and export.idf) through the
# oxideav-mesh3d scene model and its format crates (DECISIONS D36). Without it, attached models
# are kept in the project but bodies fall back to generated boxes.
models3d = [
    "dep:oxideav-mesh3d",
    "dep:oxideav-stl",
    "dep:oxideav-obj",
    "dep:oxideav-gltf",
    "dep:oxideav-usdz",
    "dep:oxideav-step",
    "dep:oxideav-vrml",
]

# `sim.sparams --solver ems`: the ems FDTD solver (crates.io `ems`, with its geometry crate `csx`;
# both MIT, no further dependencies) as a second full-wave solver on the same board region
# (DECISIONS D86). Without it the option is refused with `sim.solver_unavailable`.
ems = ["dep:ems"]

[[bin]]
name = "cadlab"
path = "src/bin/cadlab/main.rs"
required-features = ["cli"]
# The library has the same name; only document the library.
doc = false

[dependencies]
polyclip = { version = "0.0.6", features = ["serde"] }

indexmap = { version = "2.14", features = ["serde"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
strsim = "0.11"
thiserror = "2"
toml = "1.1"

rayon = { version = "1.12", optional = true }
clap = { version = "4.6", features = ["derive", "string"], optional = true }
rpassword = { version = "7.5", optional = true }
tiny-skia = { version = "0.12", optional = true }
ureq = { version = "3.4", optional = true }
oxideav-mesh3d = { version = "0.0.7", optional = true }
oxideav-stl = { version = "0.0.4", optional = true }
oxideav-obj = { version = "0.0.4", optional = true }
oxideav-gltf = { version = "0.0.4", optional = true }
oxideav-usdz = { version = "0.0.5", optional = true }
oxideav-step = { version = "0.0.1", optional = true, features = ["registry"] }
oxideav-vrml = { version = "0.0.1", optional = true, features = ["registry"] }
# Second full-wave solver (D86); its `xml` feature (openEMS files) is not needed.
ems = { version = "0.0.6", default-features = false, optional = true }
# Fab archives (D75): the user's own fstool, zip writer and reader only.
fstool = { version = "0.5.2", default-features = false, features = ["archive", "gzip"] }

[dev-dependencies]
insta = { version = "1.49", features = ["json"] }
proptest = "1"
rayon = "1.12"
tempfile = "3"

# The ems solver's tests run whole simulations: optimized in dev and test builds too (debug
# assertions and overflow checks stay on), as ems does for its own tests.
[profile.dev.package.ems]
opt-level = 2

[profile.dev.package.csx]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
